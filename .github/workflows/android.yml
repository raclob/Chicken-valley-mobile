name: Android prototype

on:
  push:
    branches: [main]
    paths-ignore:
      - 'downloads/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: android-mobile-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android export tools
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.1'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true
      - name: Import project
        run: godot --headless --editor --path . --import --quit
      - name: Test farm economy and raids
        run: godot --headless --path . --script tests.gd
      - name: Test overhead mobile scene
        run: godot --headless --path . --script mobile_tests.gd
      - name: Scene smoke check
        run: |
          godot --headless --path . --quit-after 120 2>&1 | tee scene-check.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|Failed to load script' scene-check.log; then exit 1; fi
      - name: Render mobile preview
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a godot --path . --rendering-method gl_compatibility --audio-driver Dummy -- --preview
      - name: Upload mobile preview
        uses: actions/upload-artifact@v4
        with:
          name: mobile-preview
          path: builds/mobile-preview.png
          if-no-files-found: error
          retention-days: 30
      - name: Restore prototype signing key
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/android-debug.keystore
          key: chicken-valley-mobile-debug-key-v1
      - name: Configure Android export
        shell: python
        run: |
          import os, pathlib, subprocess
          data = pathlib.Path.home() / '.local/share/godot'
          config = pathlib.Path.home() / '.config/godot'
          data.mkdir(parents=True, exist_ok=True)
          config.mkdir(parents=True, exist_ok=True)
          key = data / 'android-debug.keystore'
          if not key.exists():
              subprocess.run(['keytool', '-genkeypair', '-keystore', str(key), '-storepass', 'android', '-alias', 'androiddebugkey', '-keypass', 'android', '-dname', 'CN=Android Debug,O=Android,C=US', '-keyalg', 'RSA', '-keysize', '2048', '-validity', '10000'], check=True)
          settings = '\n'.join([
              '[gd_resource type="EditorSettings" format=3]',
              '', '[resource]',
              'export/android/java_sdk_path="' + os.environ['JAVA_HOME'] + '"',
              'export/android/android_sdk_path="' + os.environ['ANDROID_HOME'] + '"',
              'export/android/debug_keystore="' + str(key) + '"',
              'export/android/debug_keystore_user="androiddebugkey"',
              'export/android/debug_keystore_pass="android"',
              '',
          ])
          (config / 'editor_settings-4.6.tres').write_text(settings)
          pathlib.Path('builds').mkdir(exist_ok=True)
      - name: Set increasing Android version
        shell: python
        run: |
          import os, pathlib, re
          build = int(os.environ['GITHUB_RUN_NUMBER'])
          preset = pathlib.Path('export_presets.cfg')
          text = preset.read_text()
          text = re.sub(r'version/code=\d+', 'version/code=' + str(build + 2), text)
          text = re.sub(r'version/name="[^"]+"', 'version/name="0.2.' + str(build) + '"', text)
          preset.write_text(text)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('APK_VERSION=0.2.' + str(build) + '\n')
      - name: Build Android APK
        run: godot --headless --path . --export-debug Android builds/chicken-valley.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chicken-valley-android
          path: builds/chicken-valley.apk
          if-no-files-found: error
          retention-days: 30

      - name: Verify Android APK signature
        run: '"$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose builds/chicken-valley.apk'
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "prototype-${GITHUB_RUN_NUMBER}" builds/chicken-valley.apk --target "${GITHUB_SHA}" --title "Chicken Valley Android prototype ${GITHUB_RUN_NUMBER}" --notes "Chicken Valley Mobile v0.2: wider battlefield, randomized obstacle routes, working fence delays, meat sales, farm expansion, guard dogs and coyotes. Offline match against an AI rival. Download chicken-valley.apk below and install on Android. Debug-signed prototype; real-device testing is still pending."

      - name: Keep versioned APKs in downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p downloads
          if [ ! -f downloads/chicken-valley-v0.2.apk ]; then
            history_dir="$(mktemp -d)"
            gh release download prototype-1 --pattern chicken-valley.apk --dir "$history_dir"
            printf '%s  %s\n' '46d1b0b8fc7b2519bf1f259b40714041f67687256783403ee6b83df9e1ce2add' "$history_dir/chicken-valley.apk" | sha256sum --check
            "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify "$history_dir/chicken-valley.apk"
            cp "$history_dir/chicken-valley.apk" downloads/chicken-valley-v0.2.apk
          fi
          cp builds/chicken-valley.apk "downloads/chicken-valley-v${APK_VERSION}.apk"
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify "downloads/chicken-valley-v${APK_VERSION}.apk"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f downloads/*.apk
          git commit -m "Add Android APK v${APK_VERSION} to downloads [skip ci]"
          git restore export_presets.cfg
          git pull --rebase origin main
          git push origin HEAD:main
